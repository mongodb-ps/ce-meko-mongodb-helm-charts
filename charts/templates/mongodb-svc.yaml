
{{- /* Only rendered when the chart, rather than the operator, owns the external Services. */ -}}
{{- $rsExt := ((.Values.replicaSet | default dict).extAccess | default dict) -}}
{{- $shExt := ((.Values.sharding | default dict).extAccess | default dict) -}}
{{ if and (eq ((.Values.externalAccess | default dict).mode | default "operator") "chart") (or (and (eq ($rsExt.enabled | default false) true) (eq .Values.tls.enabled true)) (eq ($shExt.enabled | default false) true)) -}}
{{- $app := (.Values.clusterName | lower) -}}
{{- $namespace := .Release.Namespace -}}
{{- if and (eq ((.Values.sharding | default dict).enabled | default false) true) (eq ($shExt.enabled | default false) true) (hasKey $shExt "ports")}}

{{- $exposeMethod := ternary "NodePort" "LoadBalancer" (eq ($shExt.exposeMethod | default "NodePort" | lower) "nodeport")}}
{{- range $index, $value := .Values.sharding.extAccess.ports }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app }}-mongos-{{ $index }}-svc-external
  namespace: {{ $namespace }}
spec:
  clusterIP: ""
  externalTrafficPolicy: Cluster
  ports:
  - port: 27017
    protocol: TCP
    targetPort: 27017
    {{- if eq ( $exposeMethod | lower) "nodeport" }}
    nodePort: {{ $value }}
    {{- end }}
  selector:
    statefulset.kubernetes.io/pod-name: {{ $app }}-mongos-{{$index}}
    controller: mongodb-enterprise-operator
  sessionAffinity: None
  type: {{ $exposeMethod }}
{{- end }}

{{- else if and (eq ((.Values.replicaSet | default dict).enabled | default false) true) (eq ($rsExt.enabled | default false) true)}}
{{- $exposeMethod := ternary "NodePort" "LoadBalancer" (eq ($rsExt.exposeMethod | default "NodePort" | lower) "nodeport")}}
{{- range $index, $value := .Values.replicaSet.extAccess.ports }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app }}-{{$index}}-svc
  namespace: {{ $namespace }}
spec:
  {{- if (hasKey $value "clusterIP") }}
  clusterIP: {{ $value.clusterIP }}
  {{- else }}
  clusterIP: ""
  {{- end }}
  externalTrafficPolicy: Cluster
  ports:
  - port: 27017
    protocol: TCP
    targetPort: 27017
    {{- if eq ( $exposeMethod | lower) "nodeport" }}
    nodePort: {{ $value.port }}
    {{- end }}
  selector:
    app: {{ $app }}-svc
    statefulset.kubernetes.io/pod-name: {{ $app }}-{{$index}}
  sessionAffinity: None
  type: {{ $exposeMethod }}

{{- end }}
{{- end }}
{{- end }}